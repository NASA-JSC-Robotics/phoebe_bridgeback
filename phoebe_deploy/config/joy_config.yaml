/**:
  teleop_twist_joy_node:
    ros__parameters:
      axis_linear:  
        x: 3        # Right thumb stick vertical
        y: 2        # Right thumb stick horizontal
      scale_linear:
        x: 0.7
        y: 0.7
      scale_linear_turbo:
        x: 1.5
        y: 1.5

      axis_angular:  
        yaw: 0   # Left thumb stick horizontal
      scale_angular:
        yaw: 0.4
      require_enable_button: True
      enable_button: 7  # Left trigger button (lower)
      enable_turbo_button: 6  # Right trigger button
