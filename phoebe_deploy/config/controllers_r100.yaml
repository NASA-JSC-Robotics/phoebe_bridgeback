/**:
  controller_manager:
    ros__parameters:
      platform_velocity_controller:
        type: mecanum_drive_controller/MecanumDriveController

      odom_publisher:
        type: mecanum_drive_odom_publisher/MecanumDriveOdomPublisher

      imu_broadcaster:
        type: imu_sensor_broadcaster/IMUSensorBroadcaster

      phoebe_magic_carpet_controller:
        type: phoebe_controllers/MagicCarpetController

  platform_velocity_controller:
    ros__parameters:
      update_rate: 50

      command_joint_names: [$(var tf_prefix)front_left_wheel_joint, $(var tf_prefix)rear_left_wheel_joint, $(var tf_prefix)rear_right_wheel_joint, $(var tf_prefix)front_right_wheel_joint]
      front_left_wheel_command_joint_name: $(var tf_prefix)front_left_wheel_joint
      front_right_wheel_command_joint_name: $(var tf_prefix)front_right_wheel_joint
      rear_right_wheel_command_joint_name: $(var tf_prefix)rear_right_wheel_joint
      rear_left_wheel_command_joint_name: $(var tf_prefix)rear_left_wheel_joint

      kinematics.base_frame_offset:
        x: 0.0
        y: 0.0
        theta: 0.0
      kinematics.wheels_radius: 0.0759
      kinematics.sum_of_robot_center_projection_on_X_Y_axis: 0.59

      wheel_separation_multiplier: 1.0
      wheel_radius_multiplier: 1.0

      reference_timeout: 1.0
      cmd_vel_timeout: 0.5
      use_stamped_vel: False

      pose_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.03]
      twist_covariance_diagonal: [0.001, 0.001, 0.001, 1000000.0, 1000000.0, 0.03]

      base_frame_id: $(var tf_prefix)base_link
      odom_frame_id: $(var tf_prefix)odom
      enable_odom_tf: False

  odom_publisher:
    ros__parameters:
      update_rate: 50
      use_sim_time: False
      interface_name: 'velocity'

      state_joint_names: [$(var tf_prefix)front_left_wheel_joint, $(var tf_prefix)rear_left_wheel_joint, $(var tf_prefix)rear_right_wheel_joint, $(var tf_prefix)front_right_wheel_joint]

      kinematics.base_frame_offset:
        x: 0.0
        y: 0.0
        theta: 0.0
      kinematics.wheels_radius: 0.0759 # 0.063 for sim
      kinematics.sum_of_robot_center_projection_on_X_Y_axis: 0.59

      wheel_separation_multiplier: 1.0
      wheel_radius_multiplier: 1.0

      pose_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.03]
      twist_covariance_diagonal: [0.001, 0.001, 0.001, 1000000.0, 1000000.0, 0.03]

      base_frame_id: $(var tf_prefix)base_link
      odom_frame_id: $(var tf_prefix)odom
      enable_odom_tf: False

  imu_broadcaster:
    ros__parameters:
      use_sim_time: False
      sensor_name: "$(var tf_prefix)imu_sensor"
      frame_id:  "$(var tf_prefix)imu_0_link"

  phoebe_magic_carpet_controller:
    ros__parameters:
      linear_x_joint: $(var tf_prefix)linear_x_joint
      linear_y_joint: $(var tf_prefix)linear_y_joint
      yaw_joint: $(var tf_prefix)rotational_yaw_joint
      reference_topic: /platform_velocity_controller/reference
