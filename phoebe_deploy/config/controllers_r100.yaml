/**:
  controller_manager:
    ros__parameters:
      platform_velocity_controller:
        type: clearpath_mecanum_drive_controller/MecanumDriveController

      odom_publisher:
        type: mecanum_drive_odom_publisher/MecanumDriveOdomPublisher

      imu_broadcaster:
        type: imu_sensor_broadcaster/IMUSensorBroadcaster

  platform_velocity_controller:
    ros__parameters:
      use_sim_time: False
      interface_name: 'velocity'

      command_joint_names: [$(var tf_prefix)front_left_wheel_joint, $(var tf_prefix)rear_left_wheel_joint, $(var tf_prefix)rear_right_wheel_joint, $(var tf_prefix)front_right_wheel_joint]
      front_left_wheel_command_joint_name: $(var tf_prefix)front_left_wheel_joint
      front_right_wheel_command_joint_name: $(var tf_prefix)front_right_wheel_joint
      rear_right_wheel_command_joint_name: $(var tf_prefix)rear_right_wheel_joint
      rear_left_wheel_command_joint_name: $(var tf_prefix)rear_left_wheel_joint

      kinematics.base_frame_offset:
        x: 0.0
        y: 0.0
        theta: 0.0
      kinematics.wheels_radius: 0.0759
      kinematics.sum_of_robot_center_projection_on_X_Y_axis: 0.59

      wheel_separation_multiplier: 1.0
      wheel_radius_multiplier: 1.0

      publish_rate: 50.0
      reference_timeout: 0.1
      cmd_vel_timeout: 0.5
      use_stamped_vel: False

      pose_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.03]
      twist_covariance_diagonal: [0.001, 0.001, 0.001, 1000000.0, 1000000.0, 0.03]


      base_frame_id: $(var tf_prefix)base_link
      odom_frame_id: $(var tf_prefix)odom
      enable_odom_tf: False

      linear.x.has_velocity_limits: True
      linear.x.has_acceleration_limits: True
      linear.x.has_jerk_limits: False
      linear.x.max_velocity: 1.3
      linear.x.min_velocity: -1.3
      linear.x.max_acceleration: 1.0
      linear.x.min_acceleration: -1.0
      linear.x.max_jerk: 0.0
      linear.x.min_jerk: 0.0

      linear.y.has_velocity_limits: True
      linear.y.has_acceleration_limits: True
      linear.y.has_jerk_limits: False
      linear.y.max_velocity: 1.3
      linear.y.min_velocity: -1.3
      linear.y.max_acceleration: 1.0
      linear.y.min_acceleration: -1.0
      linear.y.max_jerk: 0.0
      linear.y.min_jerk: 0.0

      angular.z.has_velocity_limits: True
      angular.z.has_acceleration_limits: True
      angular.z.has_jerk_limits: False
      angular.z.max_velocity: 4.0
      angular.z.min_velocity: -4.0
      angular.z.max_acceleration: 2.0
      angular.z.min_acceleration: -2.0
      angular.z.max_jerk: 0.0
      angular.z.min_jerk: 0.0

  odom_publisher:
    ros__parameters:
      use_sim_time: False
      interface_name: 'velocity'

      state_joint_names: [$(var tf_prefix)front_left_wheel_joint, $(var tf_prefix)rear_left_wheel_joint, $(var tf_prefix)rear_right_wheel_joint, $(var tf_prefix)front_right_wheel_joint]

      kinematics.base_frame_offset:
        x: 0.0
        y: 0.0
        theta: 0.0
      kinematics.wheels_radius: 0.063 # THIS IS WRONG!!!!!!!! BUT PLAYING TO GET SIM TO WORK
      kinematics.sum_of_robot_center_projection_on_X_Y_axis: 0.595 # THIS IS MODIFIED FROM ORIGINAL

      wheel_separation_multiplier: 1.0
      wheel_radius_multiplier: 1.0

      pose_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.03]
      twist_covariance_diagonal: [0.001, 0.001, 0.001, 1000000.0, 1000000.0, 0.03]

      base_frame_id: $(var tf_prefix)base_link
      odom_frame_id: $(var tf_prefix)odom
      enable_odom_tf: False


  imu_broadcaster:
    ros__parameters:
      use_sim_time: False
      sensor_name: "imu_sensor"
      frame_id:  "imu_0_link"