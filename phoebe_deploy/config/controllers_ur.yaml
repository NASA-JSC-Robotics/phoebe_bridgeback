/**:
  controller_manager:
    ros__parameters:

      # right arm
      right_io_and_status_controller:
        type: ur_controllers/GPIOController

      right_force_torque_sensor_broadcaster:
        type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster

      right_ur_joint_trajectory_controller:
        type: joint_trajectory_controller/JointTrajectoryController

      right_freedrive_mode_controller:
        type: ur_controllers/FreedriveModeController

      right_forward_position_controller:
        type: forward_command_controller/ForwardCommandController

      right_forward_velocity_controller:
        type: forward_command_controller/ForwardCommandController

      right_forward_effort_controller:
        type: forward_command_controller/ForwardCommandController

      right_friction_model_controller:
        type: ur_controllers/FrictionModelController

      # admittance controllers
      right_admittance_controller:
        type: drt_admittance_controller/DrtAdmittanceController

      right_admittance_jtc:
        type: joint_trajectory_controller/JointTrajectoryController

      right_force_torque_sensor_broadcaster_admittance:
        type: force_torque_sensor_broadcaster_advanced/ForceTorqueSensorBroadcasterAdvanced

      # left arm
      left_io_and_status_controller:
        type: ur_controllers/GPIOController

      left_force_torque_sensor_broadcaster:
        type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster

      left_ur_joint_trajectory_controller:
        type: joint_trajectory_controller/JointTrajectoryController

      left_freedrive_mode_controller:
        type: ur_controllers/FreedriveModeController

      left_forward_position_controller:
        type: forward_command_controller/ForwardCommandController

      left_forward_velocity_controller:
        type: forward_command_controller/ForwardCommandController

      left_forward_effort_controller:
        type: forward_command_controller/ForwardCommandController

      left_friction_model_controller:
        type: ur_controllers/FrictionModelController

      # admittance controllers
      left_admittance_controller:
        type: drt_admittance_controller/DrtAdmittanceController

      left_admittance_jtc:
        type: joint_trajectory_controller/JointTrajectoryController

      left_force_torque_sensor_broadcaster_admittance:
        type: force_torque_sensor_broadcaster_advanced/ForceTorqueSensorBroadcasterAdvanced

  # right controllers
  right_io_and_status_controller:
    ros__parameters:
      tf_prefix: $(var tf_prefix)right_ur_arm_

  right_force_torque_sensor_broadcaster:
    ros__parameters:
      sensor_name: $(var tf_prefix)right_ur_arm_tcp_fts_sensor
      state_interface_names:
        - force.x
        - force.y
        - force.z
        - torque.x
        - torque.y
        - torque.z
      frame_id: $(var tf_prefix)right_ur_arm_tool0
      topic_name: $(var tf_prefix)right_ur_arm_ft_data

  right_ur_joint_trajectory_controller:
    ros__parameters:
      joints:
        - $(var tf_prefix)right_ur_arm_shoulder_pan_joint
        - $(var tf_prefix)right_ur_arm_shoulder_lift_joint
        - $(var tf_prefix)right_ur_arm_elbow_joint
        - $(var tf_prefix)right_ur_arm_wrist_1_joint
        - $(var tf_prefix)right_ur_arm_wrist_2_joint
        - $(var tf_prefix)right_ur_arm_wrist_3_joint
      command_interfaces:
        - position
      state_interfaces:
        - position
        - velocity
      state_publish_rate: 100.0
      action_monitor_rate: 20.0
      allow_partial_joints_goal: false
      constraints:
        stopped_velocity_tolerance: 0.2
        goal_time: 0.0
        $(var tf_prefix)right_ur_arm_shoulder_pan_joint: { trajectory: 0.2, goal: 0.1 }
        $(var tf_prefix)right_ur_arm_shoulder_lift_joint: { trajectory: 0.2, goal: 0.1 }
        $(var tf_prefix)right_ur_arm_elbow_joint: { trajectory: 0.2, goal: 0.1 }
        $(var tf_prefix)right_ur_arm_wrist_1_joint: { trajectory: 0.2, goal: 0.1 }
        $(var tf_prefix)right_ur_arm_wrist_2_joint: { trajectory: 0.2, goal: 0.1 }
        $(var tf_prefix)right_ur_arm_wrist_3_joint: { trajectory: 0.2, goal: 0.1 }

  right_freedrive_mode_controller:
    ros__parameters:
      tf_prefix: $(var tf_prefix)right_ur_arm_

  right_forward_position_controller:
    ros__parameters:
      joints:
        - $(var tf_prefix)right_ur_arm_shoulder_pan_joint
        - $(var tf_prefix)right_ur_arm_shoulder_lift_joint
        - $(var tf_prefix)right_ur_arm_elbow_joint
        - $(var tf_prefix)right_ur_arm_wrist_1_joint
        - $(var tf_prefix)right_ur_arm_wrist_2_joint
        - $(var tf_prefix)right_ur_arm_wrist_3_joint
      interface_name: position

  right_forward_velocity_controller:
    ros__parameters:
      joints:
        - $(var tf_prefix)right_ur_arm_shoulder_pan_joint
        - $(var tf_prefix)right_ur_arm_shoulder_lift_joint
        - $(var tf_prefix)right_ur_arm_elbow_joint
        - $(var tf_prefix)right_ur_arm_wrist_1_joint
        - $(var tf_prefix)right_ur_arm_wrist_2_joint
        - $(var tf_prefix)right_ur_arm_wrist_3_joint
      interface_name: velocity


  right_forward_effort_controller:
    ros__parameters:
      joints:
        - $(var tf_prefix)right_ur_arm_shoulder_pan_joint
        - $(var tf_prefix)right_ur_arm_shoulder_lift_joint
        - $(var tf_prefix)right_ur_arm_elbow_joint
        - $(var tf_prefix)right_ur_arm_wrist_1_joint
        - $(var tf_prefix)right_ur_arm_wrist_2_joint
        - $(var tf_prefix)right_ur_arm_wrist_3_joint
      interface_name: effort

  right_friction_model_controller:
    ros__parameters:
      tf_prefix: $(var tf_prefix)right_ur_arm_

  # left controllers
  left_io_and_status_controller:
    ros__parameters:
      tf_prefix: $(var tf_prefix)left_ur_arm_

  left_force_torque_sensor_broadcaster:
    ros__parameters:
      sensor_name: $(var tf_prefix)left_ur_arm_tcp_fts_sensor
      state_interface_names:
        - force.x
        - force.y
        - force.z
        - torque.x
        - torque.y
        - torque.z
      frame_id: $(var tf_prefix)left_ur_arm_tool0
      topic_name: $(var tf_prefix)left_ur_arm_ft_data

  left_ur_joint_trajectory_controller:
    ros__parameters:
      joints:
        - $(var tf_prefix)left_ur_arm_shoulder_pan_joint
        - $(var tf_prefix)left_ur_arm_shoulder_lift_joint
        - $(var tf_prefix)left_ur_arm_elbow_joint
        - $(var tf_prefix)left_ur_arm_wrist_1_joint
        - $(var tf_prefix)left_ur_arm_wrist_2_joint
        - $(var tf_prefix)left_ur_arm_wrist_3_joint
      command_interfaces:
        - position
      state_interfaces:
        - position
        - velocity
      state_publish_rate: 100.0
      action_monitor_rate: 20.0
      allow_partial_joints_goal: false
      constraints:
        stopped_velocity_tolerance: 0.2
        goal_time: 0.0
        $(var tf_prefix)left_ur_arm_shoulder_pan_joint: { trajectory: 0.2, goal: 0.1 }
        $(var tf_prefix)left_ur_arm_shoulder_lift_joint: { trajectory: 0.2, goal: 0.1 }
        $(var tf_prefix)left_ur_arm_elbow_joint: { trajectory: 0.2, goal: 0.1 }
        $(var tf_prefix)left_ur_arm_wrist_1_joint: { trajectory: 0.2, goal: 0.1 }
        $(var tf_prefix)left_ur_arm_wrist_2_joint: { trajectory: 0.2, goal: 0.1 }
        $(var tf_prefix)left_ur_arm_wrist_3_joint: { trajectory: 0.2, goal: 0.1 }

  left_freedrive_mode_controller:
    ros__parameters:
      tf_prefix: $(var tf_prefix)left_ur_arm_

  left_forward_position_controller:
    ros__parameters:
      joints:
        - $(var tf_prefix)left_ur_arm_shoulder_pan_joint
        - $(var tf_prefix)left_ur_arm_shoulder_lift_joint
        - $(var tf_prefix)left_ur_arm_elbow_joint
        - $(var tf_prefix)left_ur_arm_wrist_1_joint
        - $(var tf_prefix)left_ur_arm_wrist_2_joint
        - $(var tf_prefix)left_ur_arm_wrist_3_joint
      interface_name: position

  left_forward_velocity_controller:
    ros__parameters:
      joints:
        - $(var tf_prefix)left_ur_arm_shoulder_pan_joint
        - $(var tf_prefix)left_ur_arm_shoulder_lift_joint
        - $(var tf_prefix)left_ur_arm_elbow_joint
        - $(var tf_prefix)left_ur_arm_wrist_1_joint
        - $(var tf_prefix)left_ur_arm_wrist_2_joint
        - $(var tf_prefix)left_ur_arm_wrist_3_joint
      interface_name: velocity

  left_forward_effort_controller:
    ros__parameters:
      joints:
        - $(var tf_prefix)left_ur_arm_shoulder_pan_joint
        - $(var tf_prefix)left_ur_arm_shoulder_lift_joint
        - $(var tf_prefix)left_ur_arm_elbow_joint
        - $(var tf_prefix)left_ur_arm_wrist_1_joint
        - $(var tf_prefix)left_ur_arm_wrist_2_joint
        - $(var tf_prefix)left_ur_arm_wrist_3_joint
      interface_name: effort

  left_friction_model_controller:
    ros__parameters:
      tf_prefix: $(var tf_prefix)left_ur_arm_


  # Putting admittance controllers down here because they are a ton
  left_admittance_jtc:
    ros__parameters:
      joints:
        - $(var tf_prefix)left_ur_arm_shoulder_pan_joint
        - $(var tf_prefix)left_ur_arm_shoulder_lift_joint
        - $(var tf_prefix)left_ur_arm_elbow_joint
        - $(var tf_prefix)left_ur_arm_wrist_1_joint
        - $(var tf_prefix)left_ur_arm_wrist_2_joint
        - $(var tf_prefix)left_ur_arm_wrist_3_joint
      command_interfaces:
        - position
        # - velocity
      state_interfaces:
        - position
        # - velocity
      command_joints:
        - left_admittance_controller/$(var tf_prefix)left_ur_arm_shoulder_pan_joint
        - left_admittance_controller/$(var tf_prefix)left_ur_arm_shoulder_lift_joint
        - left_admittance_controller/$(var tf_prefix)left_ur_arm_elbow_joint
        - left_admittance_controller/$(var tf_prefix)left_ur_arm_wrist_1_joint
        - left_admittance_controller/$(var tf_prefix)left_ur_arm_wrist_2_joint
        - left_admittance_controller/$(var tf_prefix)left_ur_arm_wrist_3_joint
      state_publish_rate: 100.0
      action_monitor_rate: 20.0
      allow_partial_joints_goal: false
      constraints:
        stopped_velocity_tolerance: 0.2
        goal_time: 0.0
        $(var tf_prefix)left_ur_arm_shoulder_pan_joint: { trajectory: 0.5, goal: 0.5 }
        $(var tf_prefix)left_ur_arm_shoulder_lift_joint: { trajectory: 0.5, goal: 0.5 }
        $(var tf_prefix)left_ur_arm_elbow_joint: { trajectory: 0.5, goal: 0.5 }
        $(var tf_prefix)left_ur_arm_wrist_5_joint: { trajectory: 0.5, goal: 0.5 }
        $(var tf_prefix)left_ur_arm_wrist_2_joint: { trajectory: 0.5, goal: 0.5 }
        $(var tf_prefix)left_ur_arm_wrist_3_joint: { trajectory: 0.5, goal: 0.5 }

  # admittance controllers - these are super long so just putting these at the end
  left_admittance_controller:
    ros__parameters:
      fts_broadcaster_name: left_force_torque_sensor_broadcaster_advanced

      joints:
        - $(var tf_prefix)left_ur_arm_shoulder_pan_joint
        - $(var tf_prefix)left_ur_arm_shoulder_lift_joint
        - $(var tf_prefix)left_ur_arm_elbow_joint
        - $(var tf_prefix)left_ur_arm_wrist_1_joint
        - $(var tf_prefix)left_ur_arm_wrist_2_joint
        - $(var tf_prefix)left_ur_arm_wrist_3_joint

      command_interfaces:
        - position

      state_interfaces:
        - position
        # - velocity

      chainable_command_interfaces:
        - position
        - velocity

      kinematics:
        plugin_name: kinematics_interface_kdl/KinematicsInterfaceKDL
        plugin_package: kinematics_interface
        base: $(var tf_prefix)left_ur_arm_base_link # Assumed to be stationary
        tip: $(var tf_prefix)left_grasp_frame
        alpha: 0.0005

      # We must separately specify the name of the base link for the kinematics plugin, as was added in
      # https://github.com/ros-controls/kinematics_interface/blob/2f02ebd1ab16828c346c8ccc12e21bf8ef7a29a7/kinematics_interface_kdl/src/kinematics_interface_kdl.cpp#L51
      # This is redundant, but necessary so that the IK solver for the controller only uses the UR links,
      # and not anything the robot is attached to (e.g. a lift or rail or both!)
      # Unfortunately, as we are still on humble we must compile that interface from source.
      base: $(var tf_prefix)left_ur_arm_base_link

      ft_sensor:
        name: $(var tf_prefix)left_ur_arm_tcp_fts_sensor
        frame:
          id: $(var tf_prefix)left_ur_arm_tool0  # Wrench measurements are in this frame
        filter_coefficient: 0.1

      control:
        frame:
          id: $(var tf_prefix)left_grasp_frame # Admittance calcs (displacement etc) are done in this frame. Usually the tool or end-effector

      fixed_world_frame:
        frame:   # Gravity points down (neg. Z) in this frame (Usually: world or base_link)
          id: $(var tf_prefix)left_ur_arm_base_link # Admittance calcs (displacement etc) are done in this frame. Usually the tool or end-effector

      gravity_compensation:
        frame:
          id: $(var tf_prefix)left_ur_arm_tool0

        CoG: # specifies the center of gravity of the end effector
          pos:
            - 0.0 # x
            - 0.0 # y
            - 0.0 # z
          force: 0.0 # mass * 9.81

      admittance:
        selected_axes: # starting default to off
          - false # x
          - false # y
          - false # z
          - false # rx
          - false # ry
          - false # rz

        # Having ".0" at the end is MUST, otherwise there is a loading error
        # F = M*a + D*v + S*(x - x_d)
        mass:
          - 15.0 # x
          - 15.0 # y
          - 15.0 # z
          - 2.5 # rx
          - 2.5 # ry
          - 2.5 # rz

        damping:
          - 470.0 # x
          - 470.0 # y
          - 470.0 # z
          - 14.0 # rx
          - 14.0 # ry
          - 14.0 # rz

        stiffness:
          - 300.0 # x
          - 300.0 # y
          - 300.0 # z
          - 20.0 # rx
          - 20.0 # ry
          - 20.0 # rz

      # general settings
      enable_parameter_update_without_reactivation: true

  left_force_torque_sensor_broadcaster_admittance:
    ros__parameters:
      chained_controller_name: left_admittance_controller
      sensor_name: left_ur_arm_tcp_fts_sensor
      frame_id: $(var tf_prefix)left_ur_arm_tool0

      kinematics:
        plugin_name: kinematics_interface_kdl/KinematicsInterfaceKDL
        plugin_package: kinematics_interface
        base: $(var tf_prefix)left_ur_arm_base_link # Assumed to be stationary
        tip: $(var tf_prefix)left_grasp_frame
        alpha: 0.0005
        joints:
          - $(var tf_prefix)left_ur_arm_shoulder_pan_joint
          - $(var tf_prefix)left_ur_arm_shoulder_lift_joint
          - $(var tf_prefix)left_ur_arm_elbow_joint
          - $(var tf_prefix)left_ur_arm_wrist_1_joint
          - $(var tf_prefix)left_ur_arm_wrist_2_joint
          - $(var tf_prefix)left_ur_arm_wrist_3_joint

      base: $(var tf_prefix)left_ur_arm_base_link

      gravity_compensation:
        frame:
          id: $(var tf_prefix)left_ur_arm_tool0

        CoG: # specifies the center of gravity of the end effector
          pos:
            - 0.0 # x
            - 0.0 # y
            - 0.0 # z 0.08625
          force: 0.0 # -80.0

      fixed_world_frame:
        frame:
          id: $(var tf_prefix)left_ur_arm_base_link

  right_admittance_jtc:
    ros__parameters:
      joints:
        - $(var tf_prefix)right_ur_arm_shoulder_pan_joint
        - $(var tf_prefix)right_ur_arm_shoulder_lift_joint
        - $(var tf_prefix)right_ur_arm_elbow_joint
        - $(var tf_prefix)right_ur_arm_wrist_1_joint
        - $(var tf_prefix)right_ur_arm_wrist_2_joint
        - $(var tf_prefix)right_ur_arm_wrist_3_joint
      command_interfaces:
        - position
        - velocity
      state_interfaces:
        - position
        - velocity
      command_joints:
        - right_admittance_controller/$(var tf_prefix)right_ur_arm_shoulder_pan_joint
        - right_admittance_controller/$(var tf_prefix)right_ur_arm_shoulder_lift_joint
        - right_admittance_controller/$(var tf_prefix)right_ur_arm_elbow_joint
        - right_admittance_controller/$(var tf_prefix)right_ur_arm_wrist_1_joint
        - right_admittance_controller/$(var tf_prefix)right_ur_arm_wrist_2_joint
        - right_admittance_controller/$(var tf_prefix)right_ur_arm_wrist_3_joint
      state_publish_rate: 100.0
      action_monitor_rate: 20.0
      allow_partial_joints_goal: false
      constraints:
        stopped_velocity_tolerance: 0.2
        goal_time: 0.0
        $(var tf_prefix)right_ur_arm_shoulder_pan_joint: { trajectory: 0.5, goal: 0.5 }
        $(var tf_prefix)right_ur_arm_shoulder_lift_joint: { trajectory: 0.5, goal: 0.5 }
        $(var tf_prefix)right_ur_arm_elbow_joint: { trajectory: 0.5, goal: 0.5 }
        $(var tf_prefix)right_ur_arm_wrist_1_joint: { trajectory: 0.5, goal: 0.5 }
        $(var tf_prefix)right_ur_arm_wrist_2_joint: { trajectory: 0.5, goal: 0.5 }
        $(var tf_prefix)right_ur_arm_wrist_3_joint: { trajectory: 0.5, goal: 0.5 }

  # admittance controllers - these are super long so just putting these at the end
  right_admittance_controller:
    ros__parameters:
      fts_broadcaster_name: right_force_torque_sensor_broadcaster_advanced

      joints:
        - $(var tf_prefix)right_ur_arm_shoulder_pan_joint
        - $(var tf_prefix)right_ur_arm_shoulder_lift_joint
        - $(var tf_prefix)right_ur_arm_elbow_joint
        - $(var tf_prefix)right_ur_arm_wrist_1_joint
        - $(var tf_prefix)right_ur_arm_wrist_2_joint
        - $(var tf_prefix)right_ur_arm_wrist_3_joint

      command_interfaces:
        - position

      state_interfaces:
        - position
        # - velocity

      chainable_command_interfaces:
        - position
        - velocity

      kinematics:
        plugin_name: kinematics_interface_kdl/KinematicsInterfaceKDL
        plugin_package: kinematics_interface
        base: $(var tf_prefix)right_ur_arm_base_link # Assumed to be stationary
        tip: $(var tf_prefix)right_grasp_frame
        alpha: 0.0005

      # We must separately specify the name of the base link for the kinematics plugin, as was added in
      # https://github.com/ros-controls/kinematics_interface/blob/2f02ebd1ab16828c346c8ccc12e21bf8ef7a29a7/kinematics_interface_kdl/src/kinematics_interface_kdl.cpp#L51
      # This is redundant, but necessary so that the IK solver for the controller only uses the UR links,
      # and not anything the robot is attached to (e.g. a lift or rail or both!)
      # Unfortunately, as we are still on humble we must compile that interface from source.
      base: $(var tf_prefix)right_ur_arm_base_link

      ft_sensor:
        name: $(var tf_prefix)right_ur_arm_tcp_fts_sensor
        frame:
          id: $(var tf_prefix)right_ur_arm_tool0  # Wrench measurements are in this frame
        filter_coefficient: 0.1

      control:
        frame:
          id: $(var tf_prefix)right_grasp_frame # Admittance calcs (displacement etc) are done in this frame. Usually the tool or end-effector

      fixed_world_frame:
        frame:   # Gravity points down (neg. Z) in this frame (Usually: world or base_link)
          id: $(var tf_prefix)right_ur_arm_base_link # Admittance calcs (displacement etc) are done in this frame. Usually the tool or end-effector

      gravity_compensation:
        frame:
          id: $(var tf_prefix)right_ur_arm_tool0

        CoG: # specifies the center of gravity of the end effector
          pos:
            - 0.0 # x
            - 0.0 # y
            - 0.0 # z
          force: 0.0 # mass * 9.81

      admittance:
        selected_axes: # starting default to off
          - false # x
          - false # y
          - false # z
          - false # rx
          - false # ry
          - false # rz

        # Having ".0" at the end is MUST, otherwise there is a loading error
        # F = M*a + D*v + S*(x - x_d)
        mass:
          - 15.0 # x
          - 15.0 # y
          - 15.0 # z
          - 2.5 # rx
          - 2.5 # ry
          - 2.5 # rz

        damping:
          - 1000.0 # x
          - 1000.0 # y
          - 1000.0 # z
          - 14.0 # rx
          - 14.0 # ry
          - 14.0 # rz

        stiffness:
          - 300.0 # x
          - 300.0 # y
          - 300.0 # z
          - 20.0 # rx
          - 20.0 # ry
          - 20.0 # rz

      # general settings
      enable_parameter_update_without_reactivation: true


right_force_torque_sensor_broadcaster_admittance:
  ros__parameters:
    chained_controller_name: right_admittance_controller
    sensor_name: right_ur_arm_tcp_fts_sensor
    frame_id: $(var tf_prefix)right_ur_arm_tool0

    kinematics:
      plugin_name: kinematics_interface_kdl/KinematicsInterfaceKDL
      plugin_package: kinematics_interface
      base: $(var tf_prefix)right_ur_arm_base_link # Assumed to be stationary
