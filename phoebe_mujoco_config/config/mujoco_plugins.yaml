/**:
  ros__parameters:
    # In MuJoCo the effective mecanum rolling radius is smaller than the real robot's,
    # which affects wheel odometry over-count. ~0.063 matches the simulated contact geometry.
    kinematics.wheels_radius: 0.063

    mujoco_plugins:
      mujoco_3d_lidar_plugin:
        type: "mujoco_ros2_control_plugins/Mujoco3dLidarPlugin"
        lidar2d_0:
          frame_name: "lidar2d_0_laser"
          topic: "/ridgeback/sensors/lidar2d_0/scan"
      mujoco_camera_plugin:
        type: "mujoco_ros2_control_plugins/CameraPlugin"
        # Will be ignored if the cameras are configured to be polled (as is the default)
        camera_publish_rate: 2.0
        $(var tf_prefix)left_wrist_mounted_camera:
          policy: $(var camera_policy)
          frame_name: $(var tf_prefix)left_wrist_mounted_camera_color_optical_frame
          info_topic: /$(var tf_prefix)left_wrist_mounted_camera/color/camera_info
          image_topic: /$(var tf_prefix)left_wrist_mounted_camera/color/image_raw
          depth_topic: /$(var tf_prefix)left_wrist_mounted_camera/aligned_depth_to_color/image_raw
          trigger_service_name: /$(var tf_prefix)left_wrist_mounted_camera/request_images
        $(var tf_prefix)right_wrist_mounted_camera:
          policy: $(var camera_policy)
          frame_name: $(var tf_prefix)right_wrist_mounted_camera_color_optical_frame
          info_topic: /$(var tf_prefix)right_wrist_mounted_camera/color/camera_info
          image_topic: /$(var tf_prefix)right_wrist_mounted_camera/color/image_raw
          depth_topic: /$(var tf_prefix)right_wrist_mounted_camera/aligned_depth_to_color/image_raw
          trigger_service_name: /$(var tf_prefix)right_wrist_mounted_camera/request_images
